# ricorda di modificare "ethX" in base alla scheda di rete che stai configurando

interface=ethX

dhcp-range=ethX,<INIZIO RANGE IP>,<FINE RANGE IP>,<SUBNET DELLA RETE>,12h

# nessun default gateway: il Client deve continuare a usare la eth0 di Vagrant
dhcp-option=ethX,3

# rotta verso la rete dei Printserver attraverso R1
dhcp-option=eth1,121,<RETE + SUBNET DEI SERVER>,<IP ROUTER x INGRESSO RETE CLIENT>
# V x 1 presente
# V x 1 per ogni range necessario e corretto
# V x 1 per ogni rotta option 121 necessaria e corretta
